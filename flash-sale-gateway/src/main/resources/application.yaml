server:
  port: 21000

dubbo:
  application:
    name: api-gateway
  registry:
    address: nacos://192.168.1.117:8848
  consumer:
    timeout: 3000
    retries: 0

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes: []
    sentinel:
      enabled: true
      transport:
        dashboard: 192.168.1.117:8858
        port: 8719
      datasource:
        gw-flow:
          nacos:
            server-addr: 192.168.1.117:8848
            data-id: sentinel-flow-api-gateway.json
            data-type: json
            group-id: SENTINEL_GROUP
            rule-type: gw_flow