server:
  port: 22000

spring:
  application:
    name: account-service
  cloud:
    nacos:
      discovery:
        server-addr: 192.168.1.117:8848
        namespace: public
        enabled: false
        register-enabled: false
    sentinel:
      transport:
        dashboard: 192.168.1.117:8080
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://192.168.1.117:3306/flash_sale?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&allowMultiQueries=true&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 123456
  data:
    redis:
      host: 192.168.1.117
      port: 6379
      database: 0

mybatis:
  type-aliases-package: com.vinci.flashsale.account.biz.entity
  configuration:
    map-underscore-to-camel-case: true

dubbo:
  application:
    name: account-api-service
    qos-port: 22010
  registry:
    address: nacos://192.168.1.117:8848
  protocol:
    name: tri
    port: 20020
    host: 192.168.1.117
    serialization: protobuf
  scan:
    base-packages: com.vinci.flashsale.account.biz.api
  consumer:
    check: false
    timeout: 5000
  provider:
    timeout: 5000
    group: DUBBO_GROUP
    version: 1.0.0

seata:
  enabled: true
  tx-service-group: default_tx_group
  registry:
    type: nacos
    nacos:
      group: SEATA_GROUP
      server-addr: 192.168.1.117:8848
      application: seata-server
      namespace: public
  config:
    type: nacos
    nacos:
      group: SEATA_GROUP
      server-addr: 192.168.1.117:8848
      data-id: seata.properties
